<style>
  :root {
    --bg: #0a0a0a;
    --surface: rgba(255,255,255,0.045);
    --border: rgba(255,255,255,0.16);
    --border-hover: rgba(255,255,255,0.65);
    --text-main: #f2f2f0;
    --text-muted: #9a9a96;
    --white: #ffffff;
  }

  * { box-sizing: border-box; }

  html, body { margin: 0; }

  * {
    -webkit-user-select: none;
    -moz-user-select: none;
    user-select: none;
  }

  body {
    min-height: 100vh;
    background: #050505;
    font-family: 'Georgia', serif;
    color: var(--text-main);
    display: flex;
    justify-content: center;
    padding: 48px 20px 64px;
    position: relative;
    overflow-x: hidden;
    cursor: url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20width%3D%2220%22%20height%3D%2220%22%3E%3Ccircle%20cx%3D%2210%22%20cy%3D%2210%22%20r%3D%224%22%20fill%3D%22white%22/%3E%3Ccircle%20cx%3D%2210%22%20cy%3D%2210%22%20r%3D%224%22%20fill%3D%22none%22%20stroke%3D%22black%22%20stroke-opacity%3D%220.35%22%20stroke-width%3D%221%22/%3E%3C/svg%3E") 10 10, auto;
  }

  /* ---- designed background (no photo) ---- */
  .bg-wash {
    position: fixed;
    inset: 0;
    z-index: -3;
    background:
      radial-gradient(ellipse 900px 600px at 50% -5%, rgba(255,255,255,0.06), transparent 60%),
      radial-gradient(ellipse 700px 500px at 100% 100%, rgba(255,255,255,0.035), transparent 55%),
      radial-gradient(ellipse 700px 500px at 0% 100%, rgba(255,255,255,0.035), transparent 55%),
      linear-gradient(180deg, #0c0c0c 0%, #060606 45%, #020202 100%);
  }

  .bg-lines {
    position: fixed;
    inset: 0;
    z-index: -2;
    pointer-events: none;
    opacity: 0.05;
    background-image:
      repeating-linear-gradient(135deg, rgba(255,255,255,0.5) 0, rgba(255,255,255,0.5) 1px, transparent 1px, transparent 64px),
      repeating-linear-gradient(45deg, rgba(255,255,255,0.5) 0, rgba(255,255,255,0.5) 1px, transparent 1px, transparent 64px);
  }

  .grain {
    position: fixed;
    inset: 0;
    z-index: -1;
    pointer-events: none;
    opacity: 0.06;
    mix-blend-mode: overlay;
    animation: grain-flicker 0.4s steps(2) infinite;
  }

  @keyframes grain-flicker {
    0%   { opacity: 0.045; }
    50%  { opacity: 0.075; }
    100% { opacity: 0.05; }
  }

  .vignette {
    position: fixed;
    inset: 0;
    z-index: 2;
    pointer-events: none;
    background: radial-gradient(ellipse at 50% 42%, transparent 40%, rgba(0,0,0,0.65) 100%);
  }

  /* ---- loader ---- */
  .loader {
    position: fixed;
    inset: 0;
    z-index: 70;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #050505;
    transition: opacity 0.7s ease, visibility 0.7s ease;
  }

  .loader.hidden { opacity: 0; visibility: hidden; }

  .loader-inner { display: flex; flex-direction: column; align-items: center; gap: 18px; }

  .loader-ring {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    border: 2px solid rgba(255,255,255,0.15);
    border-top-color: var(--white);
    animation: spin 1s linear infinite;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  .loader-text {
    font-family: 'Courier New', monospace;
    font-size: 0.85rem;
    letter-spacing: 0.22em;
    color: var(--text-muted);
    text-transform: uppercase;
  }

  /* ---- page content ---- */
  .page {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 460px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .avatar-wrap {
    position: relative;
    width: 180px;
    height: 220px;
    margin-bottom: 30px;
  }

  .avatar-glow {
    position: absolute;
    inset: -5px;
    border-radius: 6px;
    background: var(--white);
    opacity: 0.18;
    filter: blur(10px);
    animation: flicker 5s ease-in-out infinite;
  }

  @keyframes flicker {
    0%, 100% { opacity: 0.1; }
    8%  { opacity: 0.22; }
    20% { opacity: 0.08; }
    35% { opacity: 0.25; }
    50% { opacity: 0.12; }
    70% { opacity: 0.2; }
    85% { opacity: 0.1; }
  }

  .avatar {
    position: relative;
    width: 100%;
    height: 100%;
    border-radius: 4px;
    overflow: hidden;
    border: 1px solid rgba(255,255,255,0.5);
    box-shadow: 0 16px 40px rgba(0,0,0,0.6);
  }

  .avatar img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    filter: grayscale(1) contrast(1.1) brightness(0.95);
    transition: transform 0.8s ease;
  }

  .avatar-wrap:hover .avatar img { transform: scale(1.05); }
  .avatar-wrap:hover .avatar-glow { opacity: 0.32; }

  h1.name {
    font-family: 'Bebas Neue', 'Georgia', sans-serif;
    font-weight: 400;
    letter-spacing: 0.1em;
    font-size: clamp(2.6rem, 10vw, 3.6rem);
    text-transform: uppercase;
    margin: 0 0 12px;
    color: var(--white);
    text-align: center;
    line-height: 1;
  }

  .masthead-rule {
    width: 120px;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--border-hover), transparent);
    margin: 0 0 28px;
  }

  .terminal {
    width: 100%;
    background: rgba(255,255,255,0.03);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    margin-bottom: 26px;
  }

  .terminal-bar {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
    color: var(--text-muted);
    font-family: 'Courier New', monospace;
    font-size: 0.82rem;
  }

  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--text-muted); opacity: 0.6; }

  .terminal-body {
    padding: 18px 18px 22px;
    font-family: 'Courier New', monospace;
    font-size: 0.95rem;
    line-height: 1.6;
  }

  .prompt { color: var(--white); margin-right: 8px; }
  .terminal-body .out { color: var(--text-main); font-style: italic; opacity: 0.9; }

  .cursor {
    display: inline-block;
    width: 8px;
    height: 1em;
    background: var(--white);
    margin-left: 6px;
    vertical-align: -2px;
    animation: blink 1.1s steps(1) infinite;
  }

  @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }

  .about-row {
    width: 100%;
    display: flex;
    gap: 14px;
    margin-bottom: 30px;
    padding: 4px 2px;
  }

  .about-row .bar {
    width: 2px;
    background: var(--border-hover);
    border-radius: 2px;
    flex-shrink: 0;
  }

  .about-row .content .label {
    font-family: 'Courier New', monospace;
    font-size: 0.78rem;
    letter-spacing: 0.15em;
    color: var(--white);
    margin-bottom: 8px;
  }

  .about-row .content p {
    margin: 0;
    color: var(--text-muted);
    font-style: italic;
    font-size: 1.02rem;
    line-height: 1.6;
  }

  .discord-card {
    position: relative;
    overflow: hidden;
    width: 100%;
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 14px 18px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    margin-bottom: 30px;
    animation: card-breathe 6s ease-in-out infinite;
    transition: border-color 0.35s ease, background 0.35s ease;
  }

  .discord-card:hover {
    border-color: var(--border-hover);
    background: rgba(255,255,255,0.06);
    animation: border-flash 0.6s ease-out;
  }

  @keyframes card-breathe {
    0%, 100% { box-shadow: 0 0 0 1px rgba(255,255,255,0.03), 0 0 8px rgba(255,255,255,0.03); }
    50%      { box-shadow: 0 0 0 1px rgba(255,255,255,0.1), 0 0 16px rgba(255,255,255,0.08); }
  }

  @keyframes border-flash {
    0%   { box-shadow: 0 0 0 1px rgba(255,255,255,0.8), 0 0 30px rgba(255,255,255,0.3); }
    100% { box-shadow: 0 0 0 1px rgba(255,255,255,0.25), 0 0 16px rgba(255,255,255,0.1); }
  }

  .discord-icon {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    background: #111;
    border: 1px solid rgba(255,255,255,0.3);
  }

  .discord-icon svg { width: 19px; height: 19px; }

  .discord-text { display: flex; flex-direction: column; gap: 3px; flex: 1; }

  .copy-btn {
    flex-shrink: 0;
    width: 34px;
    height: 34px;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text-muted);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: border-color 0.3s ease, color 0.3s ease, background 0.3s ease;
  }

  .copy-btn svg { width: 16px; height: 16px; }

  .copy-btn:hover {
    border-color: var(--border-hover);
    color: var(--white);
    background: rgba(255,255,255,0.08);
  }

  .copy-btn.copied {
    color: var(--white);
    border-color: var(--border-hover);
  }

  .discord-label {
    font-family: 'Courier New', monospace;
    font-weight: 700;
    font-size: 0.98rem;
    letter-spacing: 0.02em;
    color: var(--text-main);
  }

  .discord-handle {
    font-family: 'Courier New', monospace;
    font-size: 0.85rem;
    color: var(--text-muted);
  }

  footer {
    margin-top: 40px;
    font-family: 'Courier New', monospace;
    font-size: 0.75rem;

  <script>
    window.addEventListener('load', function () {
      setTimeout(function () {
        document.getElementById('loader').classList.add('hidden');
      }, 900);
    });

    // Copy Discord handle to clipboard
    (function () {
      var btn = document.getElementById('copyBtn');
      var icon = document.getElementById('copyIcon');
      if (!btn) return;

      var checkPath = '<polyline points="20 6 9 17 4 12"/>';
      var copyPath = '<rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/>';

      btn.addEventListener('click', function () {
        var text = 'sup.remus';

        function showCopied() {
          btn.classList.add('copied');
          icon.innerHTML = checkPath;
          setTimeout(function () {
            btn.classList.remove('copied');
            icon.innerHTML = copyPath;
          }, 1400);
        }

        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).then(showCopied).catch(function () {
            fallbackCopy(text);
            showCopied();
          });
        } else {
          fallbackCopy(text);
          showCopied();
        }
      });

      function fallbackCopy(text) {
        var ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        try { document.execCommand('copy'); } catch (e) {}
        document.body.removeChild(ta);
      }
    })();

    // Rotating famous quotes
    (function () {
      var quotes = [
        { text: "The only way to do great work is to love what you do.", author: "Steve Jobs" },
        { text: "In the middle of every difficulty lies opportunity.", author: "Albert Einstein" },
        { text: "Be yourself; everyone else is already taken.", author: "Oscar Wilde" },
        { text: "Whether you think you can, or you think you can't – you're right.", author: "Henry Ford" },
        { text: "The future belongs to those who believe in the beauty of their dreams.", author: "Eleanor Roosevelt" },
        { text: "It does not matter how slowly you go as long as you do not stop.", author: "Confucius" },
        { text: "Life is what happens to you while you're busy making other plans.", author: "John Lennon" },
        { text: "Success is not final, failure is not fatal: it is the courage to continue that counts.", author: "Winston Churchill" },
        { text: "Do not go where the path may lead, go instead where there is no path and leave a trail.", author: "Ralph Waldo Emerson" },
        { text: "Two roads diverged in a wood, and I took the one less traveled by.", author: "Robert Frost" },
        { text: "The unexamined life is not worth living.", author: "Socrates" },
        { text: "Not all those who wander are lost.", author: "J.R.R. Tolkien" }
      ];

      var idx = 0;
      var textEl = document.getElementById('quoteText');
      var authorEl = document.getElementById('quoteAuthor');

      function showQuote(i) {
        textEl.classList.add('quote-fade');
        authorEl.classList.add('quote-fade');
        setTimeout(function () {
          textEl.textContent = quotes[i].text;
          authorEl.textContent = '— ' + quotes[i].author;
          textEl.classList.remove('quote-fade');
          authorEl.classList.remove('quote-fade');
        }, 1200);
      }

      setInterval(function () {
        idx = (idx + 1) % quotes.length;
        showQuote(idx);
      }, 60000);
    })();
  </script>
</body>
</html>
