  .bg-wash {
    position: fixed;
    inset: 0;
    z-index: -2;
    background:
      radial-gradient(ellipse at 50% 20%, rgba(0,0,0,0.25), rgba(0,0,0,0.78) 65%),
      linear-gradient(180deg, rgba(5,5,5,0.55), rgba(5,5,5,0.92) 60%, #050505 100%);
  }

  .grain {
    position: fixed;
    inset: 0;
    z-index: -1;
    pointer-events: none;
    opacity: 0.06;
    mix-blend-mode: overlay;
    animation: grain-flicker 0.4s steps(2) infinite;
  }

  @keyframes grain-flicker {
    0%   { opacity: 0.045; }
    50%  { opacity: 0.075; }
    100% { opacity: 0.05; }
  }

  .vignette {
    position: fixed;
    inset: 0;
    z-index: 2;
    pointer-events: none;
    background: radial-gradient(ellipse at 50% 42%, transparent 40%, rgba(0,0,0,0.65) 100%);
  }

  /* ---- fixed view counter ---- */
  .view-counter {
    position: fixed;
    top: 18px;
    left: 18px;
    z-index: 40;
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 7px 12px;
    background: rgba(10,10,10,0.6);
    border: 1px solid var(--border);
    border-radius: 999px;
    backdrop-filter: blur(6px);
    font-family: 'Courier New', monospace;
    font-size: 0.78rem;
    color: var(--text-muted);
    -webkit-transform: translate3d(0,0,0);
    transform: translate3d(0,0,0);
    -webkit-backface-visibility: hidden;
    backface-visibility: hidden;
    will-change: transform;
  }

  .view-counter svg { width: 15px; height: 15px; flex-shrink: 0; }
  .view-counter svg path, .view-counter svg circle { stroke: var(--white); }

  /* ---- loader ---- */
  .loader {
    position: fixed;
    inset: 0;
    z-index: 70;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #050505;
    transition: opacity 0.7s ease, visibility 0.7s ease;
  }

  .loader.hidden { opacity: 0; visibility: hidden; }

  .loader-inner { display: flex; flex-direction: column; align-items: center; gap: 18px; }

  .loader-ring {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    border: 2px solid rgba(255,255,255,0.15);
    border-top-color: var(--white);
    animation: spin 1s linear infinite;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  .loader-text {
    font-family: 'Courier New', monospace;
    font-size: 0.85rem;
    letter-spacing: 0.22em;
    color: var(--text-muted);
    text-transform: uppercase;
  }

  /* ---- page content ---- */
  .page {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 460px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .avatar-wrap {
    position: relative;
    width: 180px;
    height: 220px;
    margin-bottom: 30px;
  }

  .avatar-glow {
    position: absolute;
    inset: -5px;
    border-radius: 6px;
    background: var(--white);
    opacity: 0.18;
    filter: blur(10px);
    animation: flicker 5s ease-in-out infinite;
  }

  @keyframes flicker {
    0%, 100% { opacity: 0.1; }
    8%  { opacity: 0.22; }
    20% { opacity: 0.08; }
    35% { opacity: 0.25; }
    50% { opacity: 0.12; }
    70% { opacity: 0.2; }
    85% { opacity: 0.1; }
  }

  .avatar {
    position: relative;
    width: 100%;
    height: 100%;
    border-radius: 4px;
    overflow: hidden;
    border: 1px solid rgba(255,255,255,0.5);
    box-shadow: 0 16px 40px rgba(0,0,0,0.6);
  }

  .avatar img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    filter: grayscale(1) contrast(1.1) brightness(0.95);
    transition: transform 0.8s ease;
  }

  .avatar-wrap:hover .avatar img { transform: scale(1.05); }
  .avatar-wrap:hover .avatar-glow { opacity: 0.32; }

  h1.name {
    font-family: 'Bebas Neue', 'Georgia', sans-serif;
    font-weight: 400;
    letter-spacing: 0.1em;
    font-size: clamp(2.6rem, 10vw, 3.6rem);
    text-transform: uppercase;
    margin: 0 0 12px;
    color: var(--white);
    text-align: center;
    line-height: 1;
  }

  .masthead-rule {
    width: 120px;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--border-hover), transparent);
    margin: 0 0 28px;
  }

  .terminal {
    width: 100%;
    background: rgba(255,255,255,0.03);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    margin-bottom: 26px;
  }

  .terminal-bar {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
    color: var(--text-muted);
    font-family: 'Courier New', monospace;
    font-size: 0.82rem;
  }

  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--text-muted); opacity: 0.6; }

  .terminal-body {
    padding: 18px 18px 22px;
    font-family: 'Courier New', monospace;
    font-size: 0.95rem;
    line-height: 1.6;
  }

  .prompt { color: var(--white); margin-right: 8px; }
  .terminal-body .out { color: var(--text-main); font-style: italic; opacity: 0.9; }

  .cursor {
    display: inline-block;
    width: 8px;
    height: 1em;
    background: var(--white);
    margin-left: 6px;
    vertical-align: -2px;
    animation: blink 1.1s steps(1) infinite;
  }

  @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }

  .about-row {
    width: 100%;
    display: flex;
    gap: 14px;
    margin-bottom: 30px;
    padding: 4px 2px;
  }

  .about-row .bar {
    width: 2px;
    background: var(--border-hover);
    border-radius: 2px;
    flex-shrink: 0;
  }

  .about-row .content .label {
    font-family: 'Courier New', monospace;
    font-size: 0.78rem;
    letter-spacing: 0.15em;
    color: var(--white);
    margin-bottom: 8px;
  }

  .about-row .content p {
    margin: 0;
    color: var(--text-muted);
    font-style: italic;
    font-size: 1.02rem;
    line-height: 1.6;
  }

  .discord-card {
    position: relative;
    overflow: hidden;
    width: 100%;
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 14px 18px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    margin-bottom: 30px;
    animation: card-breathe 6s ease-in-out infinite;
    transition: border-color 0.35s ease, background 0.35s ease;
  }

  .discord-card:hover {
    border-color: var(--border-hover);
    background: rgba(255,255,255,0.06);
    animation: border-flash 0.6s ease-out;
  }

  @keyframes card-breathe {
    0%, 100% { box-shadow: 0 0 0 1px rgba(255,255,255,0.03), 0 0 8px rgba(255,255,255,0.03); }
    50%      { box-shadow: 0 0 0 1px rgba(255,255,255,0.1), 0 0 16px rgba(255,255,255,0.08); }
  }

  @keyframes border-flash {
    0%   { box-shadow: 0 0 0 1px rgba(255,255,255,0.8), 0 0 30px rgba(255,255,255,0.3); }
    100% { box-shadow: 0 0 0 1px rgba(255,255,255,0.25), 0 0 16px rgba(255,255,255,0.1); }
  }

  .discord-icon {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    background: #111;
    border: 1px solid rgba(255,255,255,0.3);
  }

  .discord-icon svg { width: 19px; height: 19px; }

  .discord-text { display: flex; flex-direction: column; gap: 3px; }

  .discord-label {
    font-family: 'Courier New', monospace;
    font-weight: 700;
    font-size: 0.98rem;
    letter-spacing: 0.02em;
    color: var(--text-main);
  }

  .discord-handle {
    font-family: 'Courier New', monospace;
    font-size: 0.85rem;
    color: var(--text-muted);
  }

  footer {
    margin-top: 40px;
    font-family: 'Courier New', monospace;
    font-size: 0.75rem;
    color: var(--text-muted);
    opacity: 0.6;
    letter-spacing: 0.08em;
  }

  .quote-box {
    width: 100%;
    max-width: 460px;
    margin: 22px auto 0;
    padding: 18px 6px 0;
    text-align: center;
    border-top: 1px solid var(--border);
  }

  .quote-text {
    font-family: 'Cormorant Garamond', 'Georgia', serif;
    font-style: italic;
    font-size: 1.05rem;
    color: var(--text-muted);
    line-height: 1.6;
    transition: opacity 1.2s ease;
  }

  .quote-author {
    font-family: 'Courier New', monospace;
    font-size: 0.75rem;
    letter-spacing: 0.1em;
    color: var(--white);
    margin-top: 10px;
    transition: opacity 1.2s ease;
  }

  .quote-fade { opacity: 0; }
</style>
</head>

  <script>
    window.addEventListener('load', function () {
      setTimeout(function () {
        document.getElementById('loader').classList.add('hidden');
      }, 900);
    });

    // Unique-visitor view counter, backed by the db capability.
    (function () {
      var countEl = document.getElementById('viewCount');

      if (!window.claude || !window.claude.use) {
        countEl.textContent = '–';
        return;
      }

      window.claude.use('db').then(function (db) {
        if (!db) { countEl.textContent = '–'; return; }

        var views = db.collection('views_supremus');

        var visitorId = localStorage.getItem('supremus_visitor_id');
        var isNew = false;
        if (!visitorId) {
          visitorId = 'v_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 10);
          localStorage.setItem('supremus_visitor_id', visitorId);
          isNew = true;
        }

        function refreshCount() {
          views.get().then(function (snap) {
            countEl.textContent = snap.size;
          }).catch(function () {});
        }

        if (isNew) {
          views.doc(visitorId).set({ ts: Date.now() }).then(refreshCount).catch(function () {
            refreshCount();
          });
        } else {
          refreshCount();
        }

        views.onSnapshot(function (snap) {
          countEl.textContent = snap.size;
        }, function () {});
      }).catch(function () {
        countEl.textContent = '–';
      });
    })();

    // Rotating famous quotes
    (function () {
      var quotes = [
        { text: "The only way to do great work is to love what you do.", author: "Steve Jobs" },
        { text: "In the middle of every difficulty lies opportunity.", author: "Albert Einstein" },
        { text: "Be yourself; everyone else is already taken.", author: "Oscar Wilde" },
        { text: "Whether you think you can, or you think you can't – you're right.", author: "Henry Ford" },
        { text: "The future belongs to those who believe in the beauty of their dreams.", author: "Eleanor Roosevelt" },
        { text: "It does not matter how slowly you go as long as you do not stop.", author: "Confucius" },
        { text: "Life is what happens to you while you're busy making other plans.", author: "John Lennon" },
        { text: "Success is not final, failure is not fatal: it is the courage to continue that counts.", author: "Winston Churchill" },
        { text: "Do not go where the path may lead, go instead where there is no path and leave a trail.", author: "Ralph Waldo Emerson" },
        { text: "Two roads diverged in a wood, and I took the one less traveled by.", author: "Robert Frost" },
        { text: "The unexamined life is not worth living.", author: "Socrates" },
        { text: "Not all those who wander are lost.", author: "J.R.R. Tolkien" }
      ];

      var idx = 0;
      var textEl = document.getElementById('quoteText');
      var authorEl = document.getElementById('quoteAuthor');

      function showQuote(i) {
        textEl.classList.add('quote-fade');
        authorEl.classList.add('quote-fade');
        setTimeout(function () {
          textEl.textContent = quotes[i].text;
          authorEl.textContent = '— ' + quotes[i].author;
          textEl.classList.remove('quote-fade');
          authorEl.classList.remove('quote-fade');
        }, 1200);
      }

      setInterval(function () {
        idx = (idx + 1) % quotes.length;
        showQuote(idx);
      }, 60000);
    })();
  </script>
